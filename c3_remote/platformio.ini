[platformio]
default_envs = esp32-c3-vl53-remote
lib_dir = lib

[env:esp32-c3-vl53-remote]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_upload.after_reset = no_reset
extra_scripts = post:scripts/post_upload_reset.py
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
