[platformio]
; ใช้งานกับชุดฮาร์ดแวร์จริงแบบครบ: LCD + Keypad + HX711 + VL53L1X + USB Printer
; กด Upload ใน VS Code/PlatformIO ได้เลยโดยไม่ต้องสลับ environment เอง
default_envs = esp32-s3-hardware-test

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; ESP32-S3 N16R8: Flash 16 MB + PSRAM 8 MB (OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM

monitor_echo = yes
monitor_filters = send_on_enter

; Diagnostic programs have their own setup()/loop() and must not be linked
; into the normal clinic firmware.
build_src_filter =
    +<*>
    -<tools/i2c_scanner.cpp>
    -<tools/keypad_direct_test.cpp>
    -<tools/hx711_calibration.cpp>
    -<tools/vl53l1x_calibration.cpp>
    -<tools/position_guide.cpp>
    -<tools/lcd_static_test.cpp>

lib_deps =
    256dpi/MQTT @ ^2.5.2
    bblanchon/ArduinoJson @ ^7.3.0
    adafruit/Adafruit NeoPixel @ ^1.12.3
    ; VL53L1X is vendored in lib/VL53L1X_safe with ESP32 divide-by-zero guards.
    bogde/HX711 @ ^0.7.5
    marcoschwartz/LiquidCrystal_I2C

[env:esp32-s3-hardware-test]
extends = env:esp32-s3-n16r8
build_flags =
    ${env:esp32-s3-n16r8.build_flags}
    -DCLINIC_ENABLE_LCD=1
    -DCLINIC_ENABLE_KEYPAD=1
    -DCLINIC_KEYPAD_DIRECT_GPIO=1
    -DCLINIC_ENABLE_LOAD_CELL=1
    -DCLINIC_ENABLE_HEIGHT_SENSOR=1
    -DCLINIC_ENABLE_USB_PRINTER=1

; Isolated height experiment: boot directly into the full 16x16 ROI.
; Use HEIGHTTESTFIXED only; this is not the default clinic firmware.
[env:esp32-s3-height-wide-test]
extends = env:esp32-s3-hardware-test
build_flags =
    ${env:esp32-s3-hardware-test.build_flags}
    -DCLINIC_HEIGHT_ROI_SIZE=16

; Same integrated firmware, but it does not communicate with the soldered LCD.
; Use this to isolate LCD/I2C corruption while retaining every other module.
[env:esp32-s3-hardware-test-no-lcd]
extends = env:esp32-s3-n16r8
build_flags =
    ${env:esp32-s3-n16r8.build_flags}
    -DCLINIC_ENABLE_KEYPAD=1
    -DCLINIC_KEYPAD_DIRECT_GPIO=1
    -DCLINIC_ENABLE_LOAD_CELL=1
    -DCLINIC_ENABLE_HEIGHT_SENSOR=1
    -DCLINIC_ENABLE_USB_PRINTER=1

; โหมดทดสอบเฉพาะกิจ: จำลอง ACK แรกสูญหายด้วยคำสั่ง WRETRY
; หลังทดสอบเสร็จให้อัปโหลด esp32-s3-n16r8 กลับเพื่อใช้งานปกติ
[env:esp32-s3-walkin-retry-test]
extends = env:esp32-s3-n16r8
build_flags =
    ${env:esp32-s3-n16r8.build_flags}
    -DCLINIC_ENABLE_WALKIN_RETRY_TEST=1

; โหมดทดสอบเฉพาะกิจสำหรับคิว A: ใช้ OTP จริงและจำลอง ACK แรกสูญหาย
; หลังทดสอบเสร็จให้อัปโหลด esp32-s3-n16r8 กลับเพื่อปิดคำสั่ง ARETRY
[env:esp32-s3-online-retry-test]
extends = env:esp32-s3-n16r8
build_flags =
    ${env:esp32-s3-n16r8.build_flags}
    -DCLINIC_ENABLE_ONLINE_RETRY_TEST=1

; Dedicated I2C scanner. It only builds src/tools/i2c_scanner.cpp and does not
; start Wi-Fi, MQTT, sensors, or the queue workflow.
[env:esp32-s3-i2c-scanner]
extends = env:esp32-s3-n16r8
build_src_filter =
    -<*>
    +<tools/i2c_scanner.cpp>

; Dedicated direct-GPIO 4x4 keypad test. No Wi-Fi, MQTT, I2C or sensors.
[env:esp32-s3-keypad-direct-test]
extends = env:esp32-s3-n16r8
build_src_filter =
    -<*>
    +<tools/keypad_direct_test.cpp>

; Dedicated HX711 zero and scale-factor calibration utility.
[env:esp32-s3-hx711-calibration]
extends = env:esp32-s3-n16r8
build_src_filter =
    -<*>
    +<tools/hx711_calibration.cpp>

; Dedicated VL53L1X mounting-height and offset calibration utility.
[env:esp32-s3-vl53l1x-calibration]
extends = env:esp32-s3-n16r8
build_src_filter =
    -<*>
    +<tools/vl53l1x_calibration.cpp>

; Solo positioning test. It collects readings while a person is on the scale
; and prints the result only after they step off, so no helper is required.
[env:esp32-s3-position-guide]
extends = env:esp32-s3-n16r8
build_src_filter =
    -<*>
    +<tools/position_guide.cpp>

; Writes a fixed four-line pattern only once. This isolates LCD wiring,
; backpack mapping and I2C integrity from the rest of the clinic firmware.
[env:esp32-s3-lcd-static-test]
extends = env:esp32-s3-n16r8
build_src_filter =
    -<*>
    +<tools/lcd_static_test.cpp>
lib_deps =
    ${env:esp32-s3-n16r8.lib_deps}
    duinoWitchery/hd44780 @ ^1.3.2
