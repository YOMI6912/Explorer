[platformio]
default_envs = esp32-s3-clinic

[env:esp32-s3-clinic]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCLINIC_ENABLE_LCD=1
    -DCLINIC_ENABLE_KEYPAD=1
    -DCLINIC_KEYPAD_DIRECT_GPIO=1
    -DCLINIC_ENABLE_LOAD_CELL=1
    -DCLINIC_ENABLE_HEIGHT_SENSOR=1
    -DCLINIC_ENABLE_USB_PRINTER=1
    -DCLINIC_REMOTE_HEIGHT=1
lib_deps =
    256dpi/MQTT @ ^2.5.2
    bblanchon/ArduinoJson @ ^7.3.0
    adafruit/Adafruit NeoPixel @ ^1.12.3
    bogde/HX711 @ ^0.7.5
    marcoschwartz/LiquidCrystal_I2C
